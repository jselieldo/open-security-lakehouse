name: open-security-lakehouse

services:
  vector:
    image: timberio/vector:0.61.0-debian
    restart: unless-stopped
    environment:
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:?Set COLLECTOR_API_TOKEN in .env}
      SYSLOG_ALLOWED_CIDR: ${SYSLOG_ALLOWED_CIDR:-192.168.0.0/16}
    volumes:
      - ./infrastructure/vector/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
    ports:
      - "${SYSLOG_BIND_ADDRESS:-0.0.0.0}:${SYSLOG_PORT:-5514}:5514/tcp"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vector", "validate", "--no-environment", "/etc/vector/vector.toml"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 10s
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  keycloak-db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [identity]
    security_opt: ["no-new-privileges:true"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true", "--hostname=http://127.0.0.1:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    volumes:
      - ./infrastructure/keycloak/osl-realm.json:/opt/keycloak/data/import/osl-realm.json:ro
    ports:
      - "${OIDC_BIND_ADDRESS:-127.0.0.1}:${OIDC_PORT:-8080}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [identity]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: "no"
    entrypoint: ["/bin/bash", "/configure.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      OIDC_TEST_USERNAME: ${OIDC_TEST_USERNAME:-osl-analyst}
      OIDC_TEST_PASSWORD: ${OIDC_TEST_PASSWORD:?Set OIDC_TEST_PASSWORD in .env}
      OIDC_ADMIN_USERNAME: ${OIDC_ADMIN_USERNAME:-osl-admin}
      OIDC_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:?Set OIDC_ADMIN_PASSWORD in .env}
    volumes:
      - ./infrastructure/keycloak/configure.sh:/configure.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks: [identity]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  seaweed-master:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "master -ip=seaweed-master -mdir=/data"
    volumes:
      - seaweed-master-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweed-master:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-volume:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=8"
    depends_on:
      seaweed-master:
        condition: service_healthy
    volumes:
      - seaweed-volume-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweed-volume:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-filer:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer -defaultStoreDir=/data"
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-volume:
        condition: service_healthy
    volumes:
      - seaweed-filer-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweed-filer:8888/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "s3 -filer=seaweed-filer:8888 -port=8333 -config=/etc/seaweedfs/s3.json"
    depends_on:
      seaweed-filer:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ./infrastructure/seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
      - ./infrastructure/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S --spider http://seaweed-s3:8333/ 2>&1 | grep -Eq 'HTTP/1.1 (200|403)'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OSL_API_TOKEN: ${OSL_API_TOKEN:?Set OSL_API_TOKEN in .env}
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:?Set COLLECTOR_API_TOKEN in .env}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://127.0.0.1:8080/realms/osl}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/osl/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-osl-api}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-osl-console}
      S3_ENDPOINT_URL: http://seaweed-s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-osl-security-data}
    ports:
      - "${OSL_BIND_ADDRESS:-127.0.0.1}:${OSL_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [backend, storage, identity]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

networks:
  backend:
    # Required for publishing the API on the host. PostgreSQL remains private
    # because it has no published ports.
    internal: false
  storage:
    internal: true
  identity:
    internal: false

volumes:
  postgres-data:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:
  keycloak-db-data:
  vector-data:

