name: open-security-lakehouse

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  seaweed-master:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "master -ip=seaweed-master -mdir=/data"
    volumes:
      - seaweed-master-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-volume:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=8"
    depends_on:
      seaweed-master:
        condition: service_healthy
    volumes:
      - seaweed-volume-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-filer:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer -defaultStoreDir=/data"
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-volume:
        condition: service_healthy
    volumes:
      - seaweed-filer-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "s3 -filer=seaweed-filer:8888 -port=8333 -config=/etc/seaweedfs/s3.json"
    depends_on:
      seaweed-filer:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ./infrastructure/seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
      - ./infrastructure/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8333"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OSL_API_TOKEN: ${OSL_API_TOKEN:?Set OSL_API_TOKEN in .env}
      S3_ENDPOINT_URL: http://seaweed-s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-osl-security-data}
    ports:
      - "${OSL_BIND_ADDRESS:-127.0.0.1}:${OSL_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweed-s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [backend, storage]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

networks:
  backend:
    internal: true
  storage:
    internal: true

volumes:
  postgres-data:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:

