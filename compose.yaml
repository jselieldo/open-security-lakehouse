name: open-security-lakehouse

services:
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "/bin/amtool", "--alertmanager.url=http://127.0.0.1:9093", "config", "show"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [observability]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      alertmanager:
        condition: service_healthy
      api:
        condition: service_healthy
      vector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [observability]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [observability]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  vector:
    image: timberio/vector:0.61.0-debian
    restart: unless-stopped
    environment:
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:?Set COLLECTOR_API_TOKEN in .env}
      SYSLOG_ALLOWED_CIDR: ${SYSLOG_ALLOWED_CIDR:-192.168.0.0/16}
    volumes:
      - ./infrastructure/vector/vector.toml.template:/etc/vector/vector.toml.template:ro
      - ./infrastructure/vector/entrypoint.sh:/entrypoint.sh:ro
      - ./data/mtls/ca/ca.crt:/etc/osl/mtls/ca.crt:ro
      - ./data/mtls/server/server.crt:/etc/osl/mtls/server.crt:ro
      - ./data/mtls/server/server.key:/etc/osl/mtls/server.key:ro
      - vector-data:/var/lib/vector
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["--config", "/tmp/vector.toml"]
    ports:
      - "${SYSLOG_MTLS_BIND_ADDRESS:-0.0.0.0}:${SYSLOG_MTLS_PORT:-6514}:6514/tcp"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vector", "validate", "/tmp/vector.toml"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 10s
    networks: [backend, observability]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  keycloak-db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [identity]
    security_opt: ["no-new-privileges:true"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true", "--hostname=${OIDC_PUBLIC_ORIGIN:-http://127.0.0.1:18080}"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    volumes:
      - ./infrastructure/keycloak/osl-realm.json:/opt/keycloak/data/import/osl-realm.json:ro
    ports:
      - "${OIDC_BIND_ADDRESS:-127.0.0.1}:${OIDC_PORT:-8080}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [identity]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: "no"
    entrypoint: ["/bin/bash", "/configure.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      OIDC_TEST_USERNAME: ${OIDC_TEST_USERNAME:-osl-analyst}
      OIDC_TEST_PASSWORD: ${OIDC_TEST_PASSWORD:?Set OIDC_TEST_PASSWORD in .env}
      OIDC_ADMIN_USERNAME: ${OIDC_ADMIN_USERNAME:-osl-admin}
      OIDC_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:?Set OIDC_ADMIN_PASSWORD in .env}
    volumes:
      - ./infrastructure/keycloak/configure.sh:/configure.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks: [identity]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  seaweed-master:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "master -ip=seaweed-master -mdir=/data"
    volumes:
      - seaweed-master-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweed-master:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-volume:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=${SEAWEED_VOLUME_MAX:-64}"
    depends_on:
      seaweed-master:
        condition: service_healthy
    volumes:
      - seaweed-volume-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweed-volume:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-filer:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer -defaultStoreDir=/data"
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-volume:
        condition: service_healthy
    volumes:
      - seaweed-filer-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://seaweed-filer:8888/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  seaweed-s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "s3 -filer=seaweed-filer:8888 -port=8333 -config=/etc/seaweedfs/s3.json"
    depends_on:
      seaweed-filer:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ./infrastructure/seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
      - ./infrastructure/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S --spider http://seaweed-s3:8333/ 2>&1 | grep -Eq 'HTTP/1.1 (200|403)'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OSL_API_TOKEN: ${OSL_API_TOKEN:?Set OSL_API_TOKEN in .env}
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:?Set COLLECTOR_API_TOKEN in .env}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://127.0.0.1:18080/realms/osl}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/osl/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-osl-api}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-osl-console}
      DETECTION_SCHEDULER_ENABLED: "false"
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SOURCE_HEALTH_CHECK_MINUTES: ${SOURCE_HEALTH_CHECK_MINUTES:-5}
      S3_ENDPOINT_URL: http://seaweed-s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-osl-security-data}
    ports:
      - "${OSL_BIND_ADDRESS:-127.0.0.1}:${OSL_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [backend, storage, identity, observability]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  detection-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OSL_API_TOKEN: ${OSL_API_TOKEN:?Set OSL_API_TOKEN in .env}
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:?Set COLLECTOR_API_TOKEN in .env}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://127.0.0.1:18080/realms/osl}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/osl/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-osl-api}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-osl-console}
      S3_ENDPOINT_URL: http://seaweed-s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-osl-security-data}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SOURCE_HEALTH_CHECK_MINUTES: ${SOURCE_HEALTH_CHECK_MINUTES:-5}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks: [backend, storage, observability]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 768m

networks:
  backend:
    # Required for publishing the API on the host. PostgreSQL remains private
    # because it has no published ports.
    internal: false
  storage:
    internal: true
  identity:
    internal: false
  observability:
    internal: false

volumes:
  postgres-data:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:
  keycloak-db-data:
  vector-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

