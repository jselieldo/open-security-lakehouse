id: high-severity-events
title: High severity security events
description: Detects normalized security events with severity 4 or greater.
severity: high
enabled: true
schedule_minutes: 15
threshold: 1
lookback_minutes: 20
query:
  min_severity: 4
  exclude_sources:
    - synthetic-linux
    - test-syslog
    - test-docker
  limit: 1000
