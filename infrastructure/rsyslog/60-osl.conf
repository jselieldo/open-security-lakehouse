# Selective local forwarding to the Open Security Lakehouse collector.
# Authentication events plus warning-or-higher kernel/daemon messages are sent.
global(workDirectory="/var/spool/rsyslog")
global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/rsyslog.d/osl-mtls/ca.crt"
  DefaultNetstreamDriverCertFile="/etc/rsyslog.d/osl-mtls/client.crt"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/osl-mtls/client.key"
)

ruleset(name="osl_forward") {
  action(
    type="omfwd"
    target="__OSL_SYSLOG_HOST__"
    port="6514"
    protocol="tcp"
    StreamDriver="gtls"
    StreamDriverMode="1"
    StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers="osl-syslog"
    template="RSYSLOG_SyslogProtocol23Format"
    action.resumeRetryCount="-1"
    queue.type="LinkedList"
    queue.filename="osl-forward"
    queue.saveOnShutdown="on"
  )
}

if ($syslogfacility-text == "auth" or $syslogfacility-text == "authpriv") then {
  call osl_forward
}
if (($syslogfacility-text == "kern" or $syslogfacility-text == "daemon") and $syslogseverity <= 4) then {
  call osl_forward
}
